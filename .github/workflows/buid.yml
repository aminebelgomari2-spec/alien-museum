name: Build 3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer l'environnement 3DS et les outils
        run: |
          dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-citro2d
          apt-get update && apt-get install -y wget unzip qrencode
          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -j bannertool.zip "linux-x86_64/bannertool" -d /opt/devkitpro/tools/bin
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip -o makerom-v0.18-ubuntu_x86_64.zip makerom -d /opt/devkitpro/tools/bin
          chmod a+x /opt/devkitpro/tools/bin/makerom /opt/devkitpro/tools/bin/bannertool

      - name: Compiler (.3dsx)
        run: make

      - name: Creer le .cia
        run: make cia

      - name: Generer le QR code
        run: qrencode -o alien_museum-qr.png -s 10 -m 2 "https://github.com/${{ github.repository }}/releases/download/latest/alien_museum.cia"

      - name: Sauvegarder les fichiers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: alien_museum
          path: |
            alien_museum.3dsx
            alien_museum.cia
            alien_museum-qr.png

      - name: Publier dans les Releases (tag latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Derniere version
          files: |
            alien_museum.3dsx
            alien_museum.cia
            alien_museum-qr.png
